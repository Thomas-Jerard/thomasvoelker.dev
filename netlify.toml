[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NETLIFY = "true"

[dev]
  command = "npm run dev"
  port = 8080

[[redirects]]
  from = "/projects"
  to = "/work"
  status = 301

[[redirects]]
  from = "/portfolio"
  to = "/work"
  status = 301

[[redirects]]
  from = "/resume"
  to = "/about"
  status = 301
