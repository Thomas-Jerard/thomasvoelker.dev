<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Instrument Serif";
        font-style: normal;
        font-weight: 400;
        src: url("instrument-serif-latin-400-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Instrument Serif";
        font-style: italic;
        font-weight: 400;
        src: url("instrument-serif-latin-400-italic.woff2") format("woff2");
      }
      @font-face {
        font-family: "JetBrains Mono";
        font-style: normal;
        font-weight: 400;
        src: url("jetbrains-mono-latin-400-normal.woff2") format("woff2");
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1792px;
        height: 1008px;
        overflow: hidden;
        background: #050505;
      }
      .card {
        position: relative;
        width: 1792px;
        height: 1008px;
        background: #050505;
        overflow: hidden;
      }
      .portrait {
        position: absolute;
        top: 0;
        right: 0;
        width: 64%;
        height: 100%;
        object-fit: cover;
        object-position: 48% 12%;
        filter: grayscale(1) contrast(1.08) brightness(0.94);
      }
      .scrim {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          90deg,
          #050505 0%,
          #050505 34%,
          rgba(5, 5, 5, 0.88) 46%,
          rgba(5, 5, 5, 0.42) 60%,
          rgba(5, 5, 5, 0.08) 76%,
          rgba(5, 5, 5, 0.22) 100%
        );
      }
      .vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          ellipse 78% 90% at 68% 42%,
          rgba(5, 5, 5, 0) 40%,
          rgba(5, 5, 5, 0.38) 100%
        );
      }
      .grain {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0.07;
        mix-blend-mode: overlay;
        pointer-events: none;
      }
      .lockup {
        position: absolute;
        left: 112px;
        top: 50%;
        transform: translateY(-50%);
        width: 720px;
        color: #f3f3f3;
      }
      .name {
        font-family: "Instrument Serif", Georgia, "Liberation Serif", serif;
        font-weight: 400;
        font-size: 148px;
        line-height: 0.9;
        letter-spacing: -0.028em;
        color: #f3f3f3;
        -webkit-font-smoothing: antialiased;
      }
      .rule {
        width: 64px;
        height: 1px;
        background: #9a9a9a;
        margin: 40px 0 28px;
      }
      .tag {
        font-family: "JetBrains Mono", "Liberation Mono", monospace;
        font-size: 22px;
        letter-spacing: 0.22em;
        color: #9a9a9a;
        font-weight: 400;
        -webkit-font-smoothing: antialiased;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img class="portrait" src="portrait-bw.jpg" alt="" />
      <div class="scrim"></div>
      <div class="vignette"></div>
      <img class="grain" src="grain.jpg" alt="" />
      <div class="lockup">
        <div class="name">Thomas<br />Voelker</div>
        <div class="rule"></div>
        <div class="tag">Founder of Orilo</div>
      </div>
    </div>
  </body>
</html>
